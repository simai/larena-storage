          type: 'string'
          maxLength: 120
        record_id:
          type: 'string'
          maxLength: 39
        revision:
          type: 'integer'
        locale:
          type: 'string'
          pattern: '^[a-z]{2,3}([_-][A-Za-z0-9]{2,8})*$'
          maxLength: 16
        values:
          type: 'object'
          additionalProperties: true
          properties: {}
          required: []
        localized_field_keys:
          type: 'array'
          items:
            type: 'string'
            pattern: '^[a-z][a-z0-9_]{0,63}$'
            maxLength: 64
        required_field_keys:
          type: 'array'
          items:
            type: 'string'
            pattern: '^[a-z][a-z0-9_]{0,63}$'
            maxLength: 64
        partial_locales_allowed:
          type: 'boolean'
      required:
        - 'schema_id'
        - 'record_id'
        - 'revision'
