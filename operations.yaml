          pattern: '^[a-z][a-z0-9_]{0,63}$'
          maxLength: 64
        from_record_id:
          type: 'string'
          minLength: 1
          maxLength: 39
      required:
        - 'relation_key'
        - 'from_record_id'
    output:
      type: 'object'
      additionalProperties: false
      properties:
        relations:
          type: 'array'
          items:
            type: 'object'
            additionalProperties: true
            properties:
              relation_id:
                type: 'string'
                maxLength: 190
              relation_key:
                type: 'string'
                pattern: '^[a-z][a-z0-9_]{0,63}$'
                maxLength: 64
              schema_id:
                type: 'string'
                maxLength: 120
              from_record_id:
                type: 'string'
                minLength: 1
                maxLength: 39
              to_record_id:
                type: 'string'
                maxLength: 39
              kind:
                type: 'string'
                enum:
                  - 'reference'
                  - 'tree_parent'
              delete_policy:
                type: 'string'
                enum:
                  - 'restrict'
                  - 'cascade'
                  - 'detach'
              status:
                type: 'string'
                enum:
                  - 'active'
                  - 'detached'
              path:
                type: 'string'
                maxLength: 2048
              depth:
                type: 'integer'
              order_index:
                type: 'integer'
            required: []
      required:
