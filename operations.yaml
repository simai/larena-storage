  - name: 'storage.tree.children'
    execution_mode: 'sync'
    risk: 'read'
    reversible: true
    access_scope: 'storage.relation.read'
    transports:
      - 'local'
    input:
      type: 'object'
      additionalProperties: false
      properties:
        relation_key:
          type: 'string'
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          maxLength: 64
        parent_record_id:
          type: 'string'
          minLength: 1
