    input:
      type: 'object'
      additionalProperties: false
      properties:
        role_ref:
          type: 'string'
          minLength: 1
          maxLength: 140
        schema_id:
          type: 'string'
          maxLength: 120
        scope_ref:
          type: 'string'
          pattern: '^(site|organization):[a-z0-9][a-z0-9_-]{0,62}$'
          maxLength: 80
        fields:
          type: 'array'
          items:
            type: 'object'
            additionalProperties: false
            properties:
              key:
                type: 'string'
                minLength: 1
                maxLength: 64
              type:
                type: 'string'
                minLength: 1
                maxLength: 64
            required:
              - 'key'
              - 'type'
        declared_relation_keys:
          type: 'array'
          items:
            type: 'string'
            maxLength: 64
        schema_lifecycle:
          type: 'string'
          enum:
            - 'plain'
            - 'publishable'
      required:
        - 'role_ref'
        - 'schema_id'
        - 'scope_ref'
    output:
      type: 'object'
      additionalProperties: false
      properties:
        binding:
          type: 'object'
          additionalProperties: true
          properties:
            binding_id:
              type: 'string'
              maxLength: 190
            role_ref:
              type: 'string'
              minLength: 1
              maxLength: 140
            schema_id:
              type: 'string'
              maxLength: 120
            scope_ref:
              type: 'string'
              pattern: '^(site|organization):[a-z0-9][a-z0-9_-]{0,62}$'
              maxLength: 80
            status:
              type: 'string'
              enum:
                - 'active'
                - 'revoked'
          required: []
      required:
        - 'binding'
    receipt:
      type: 'object'
      additionalProperties: true
      properties:
        operation:
          type: 'string'
          maxLength: 120
        target_ref:
          type: 'string'
          maxLength: 190
        change:
          type: 'string'
          minLength: 1
          maxLength: 191
      required:
        - 'operation'
        - 'change'
  - name: 'storage.role.list_structures'
    execution_mode: 'sync'
    risk: 'read'
    reversible: true
    access_scope: 'storage.role.read'
    transports:
      - 'local'
    input:
