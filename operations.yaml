      required:
        - 'schema_id'
        - 'record_id'
        - 'revision'
        - 'locale'
    output:
      type: 'object'
      additionalProperties: false
      properties:
        values:
          type: 'array'
          items:
            type: 'object'
            additionalProperties: true
            properties:
              field_key:
                type: 'string'
                pattern: '^[a-z][a-z0-9_]{0,63}$'
                maxLength: 64
              requested_locale:
                type: 'string'
                pattern: '^[a-z]{2,3}([_-][A-Za-z0-9]{2,8})*$'
                maxLength: 16
              source_locale:
                type: 'string'
                pattern: '^[a-z]{2,3}([_-][A-Za-z0-9]{2,8})*$'
                maxLength: 16
              value:
                type: 'string'
              exact:
                type: 'boolean'
              resolution:
                type: 'string'
                enum:
                  - 'exact'
                  - 'fallback'
            required:
              - 'field_key'
              - 'requested_locale'
              - 'source_locale'
              - 'exact'
              - 'resolution'
      required:
