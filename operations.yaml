    output:
      type: 'object'
      additionalProperties: false
      properties:
        bindings:
          type: 'array'
          items:
            type: 'object'
            additionalProperties: true
            properties:
              binding_id:
                type: 'string'
                maxLength: 190
              role_ref:
                type: 'string'
                minLength: 1
                maxLength: 140
              schema_id:
                type: 'string'
                maxLength: 120
              scope_ref:
                type: 'string'
                pattern: '^(site|organization):[a-z0-9][a-z0-9_-]{0,62}$'
                maxLength: 80
              status:
                type: 'string'
                enum:
                  - 'active'
                  - 'revoked'
            required: []
      required:
        - 'bindings'
  - name: 'storage.role.explain'
    execution_mode: 'sync'
    risk: 'read'
    reversible: true
    access_scope: 'storage.role.read'
    transports:
      - 'local'
    input:
      type: 'object'
      additionalProperties: false
      properties:
        role_ref:
          type: 'string'
          minLength: 1
          maxLength: 140
      required:
        - 'role_ref'
    output:
      type: 'object'
      additionalProperties: true
      properties:
        role_ref:
          type: 'string'
          minLength: 1
          maxLength: 140
        exists:
          type: 'boolean'
      required: []
  - name: 'storage.relation.define'
    execution_mode: 'sync'
    risk: 'change'
    reversible: true
    access_scope: 'storage.relation.manage'
    audit_event: 'storage.relation.defined'
    idempotency_key: 'relation_id'
    transactional: true
    transports:
      - 'local'
    input:
      type: 'object'
      additionalProperties: false
      properties:
        relation_key:
          type: 'string'
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          maxLength: 64
        kind:
          type: 'string'
          enum:
            - 'reference'
            - 'tree_parent'
        delete_policy:
          type: 'string'
          enum:
