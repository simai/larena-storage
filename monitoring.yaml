# Metrics declared by larena/storage. Registered into larena/monitoring's MetricCatalog by StorageServiceProvider
# only when larena/monitoring is installed; storage never depends on it. Tags are codes only: never record ids,
# schema ids, titles or values.
metrics:
  # One workbench record list. mode is sql (read from the витрина) or legacy (the versions scan); count is exact,
  # approx (an estimate above the threshold) or skip; outcome ok, rejected (a refused query or access) or error.
  storage.list:
    type: duration
    tags: [mode, count]
    thresholds: { p95_ms: 300, error_rate: 0.05 }
    retention: { raw: 7d, aggregate: 90d }
  # One public list (storage.read.published_list, GET /api/v1/site/list). path is slot (the site витрина slot
  # answered), fallback (the published records, at most 5000) or none (refused before either); count is exact,
  # approx or skip (also when a visibility filter applied); outcome ok, rejected (an invalid query, a list that is
  # not ready) or error.
  storage.read.published_list:
    type: duration
    tags: [path, count]
    thresholds: { p95_ms: 200, error_rate: 0.05 }
    retention: { raw: 7d, aggregate: 90d }
  # One record version read (current or exact revision); outcome ok, rejected or error.
  storage.read:
    type: duration
    tags: []
    thresholds: { p95_ms: 100, error_rate: 0.05 }
    retention: { raw: 7d, aggregate: 90d }
  # One record write. operation is create, update, archive, restore, purge or revert; outcome ok, rejected or error.
  storage.write:
    type: duration
    tags: []
    thresholds: { p95_ms: 300, error_rate: 0.05 }
    retention: { raw: 7d, aggregate: 90d }
  # One committed chunk of a витрина rebuild (inline or from the storage.view.rebuild queue job).
  storage.view.rebuild:
    type: duration
    tags: []
    thresholds: { p95_ms: 5000 }
    retention: { raw: 7d, aggregate: 90d }
  # Rows a витрина rebuild wrote, counted per chunk.
  storage.view.rebuild_rows:
    type: counter
    tags: []
    retention: { raw: 7d, aggregate: 90d }
