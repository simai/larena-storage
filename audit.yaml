schema: larena.audit.package-events.v1
package: larena/storage
storage_owner: larena/audit
retention: security
atomic_completion: true
events:
  - type: storage.schema.created
    category: storage_schema
    severity: security
  - type: storage.schema.versioned
    category: storage_schema
    severity: security
  - type: storage.record.created
    category: storage_record
    severity: security
  - type: storage.record.updated
    category: storage_record
    severity: security
forbidden_payload_fields:
  - value
  - values
  - field_value
  - field_values
  - raw_value
  - raw_values
  - payload
  - content
  - secret
  - token
  - credential
  - password
nonclaims:
  production_ready: false
  all_packages_ready: false
